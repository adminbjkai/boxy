        // Move Modal with Tree View
        let folderTreeData = [];
        let expandedFolders = new Set();

        async function showMoveModal(path) {
            document.getElementById('moveModal').classList.add('active');
            document.getElementById('movePath').value = path;
            document.getElementById('moveDestination').value = '';
            updateSelectedPathDisplay('');

            const res = await fetch('/api/folders');
            const folders = await res.json();
            folderTreeData = buildFolderTree(folders);
            expandedFolders = new Set();
            // Auto-expand first level
            folderTreeData.forEach(f => expandedFolders.add(f.path));
            renderFolderTree();
        }

        function buildFolderTree(folders) {
            const tree = [];
            const map = {};

            // Sort folders by path
            folders.sort((a, b) => a.localeCompare(b));

            folders.forEach(path => {
                if (path === '/') {
                    return; // Root is shown separately
                }

                const parts = path.split('/');
                const name = parts[parts.length - 1];
                const parentPath = parts.slice(0, -1).join('/');

                const node = { name, path, children: [], depth: parts.length - 1 };
                map[path] = node;

                if (parentPath && map[parentPath]) {
                    map[parentPath].children.push(node);
                } else {
                    tree.push(node);
                }
            });

            return tree;
        }

        function renderFolderTree() {
            const container = document.getElementById('folderTree');
            const selectedPath = document.getElementById('moveDestination').value;

            let html = `
                <div class="tree-item ${selectedPath === '' ? 'selected' : ''}" onclick="selectMoveDestination('')">
                    <div class="tree-toggle empty"></div>
                    <svg class="tree-folder-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span class="tree-folder-name">Root</span>
                    <span class="tree-path">/</span>
                </div>
            `;

            html += renderTreeNodes(folderTreeData, selectedPath, 0);
            container.innerHTML = html;
        }

        function renderTreeNodes(nodes, selectedPath, depth) {
            let html = '';

            nodes.forEach(node => {
                const hasChildren = node.children && node.children.length > 0;
                const isExpanded = expandedFolders.has(node.path);
                const isSelected = selectedPath === node.path;

                html += `
                    <div class="tree-item ${isSelected ? 'selected' : ''}"
                         style="padding-left: ${12 + depth * 20}px"
                         onclick="selectMoveDestination('${escapeAttr(node.path)}')">
                        <div class="tree-toggle ${hasChildren ? (isExpanded ? 'expanded' : '') : 'empty'}"
                             onclick="event.stopPropagation(); toggleFolderExpand('${escapeAttr(node.path)}')">
                            ${hasChildren ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="9 18 15 12 9 6"/>
                            </svg>` : ''}
                        </div>
                        <svg class="tree-folder-icon" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M10 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-8l-2-2z"/>
                        </svg>
                        <span class="tree-folder-name">${escapeHtml(node.name)}</span>
                    </div>
                `;

                if (hasChildren && isExpanded) {
                    html += renderTreeNodes(node.children, selectedPath, depth + 1);
                }
            });

            return html;
        }

        function toggleFolderExpand(path) {

        function formatSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));

            if (days === 0) {
                return 'Today ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            } else if (days === 1) {
                return 'Yesterday';
            } else if (days < 7) {
                return date.toLocaleDateString([], { weekday: 'short' });
            }
            return date.toLocaleDateString([], { month: 'short', day: 'numeric', year: now.getFullYear() !== date.getFullYear() ? 'numeric' : undefined });
        }

        function formatDatePart(timestamp) {
            if (!timestamp) return '';
            const d = new Date(timestamp * 1000);
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const yyyy = d.getFullYear();
            return `${mm}/${dd}/${yyyy}`;
        }

        function formatTimePart(timestamp) {
            if (!timestamp) return '';
            return new Date(timestamp * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

            const grid = document.getElementById('fileGrid');

        function moveFocus(delta) {
            const items = document.querySelectorAll('.file-item');
            if (items.length === 0) return;

            if (focusedIndex < 0) {
                focusedIndex = 0;
            } else {
                focusedIndex = Math.max(0, Math.min(items.length - 1, focusedIndex + delta));
            }
            updateFocusUI();
        }

        function handleKeyboardNav(e) {
            // Skip if in input/modal
            if (e.target.matches('input, textarea, select') ||
                document.querySelector('.modal.active') ||
                document.getElementById('globalSearch').classList.contains('active')) {
                return;
            }

            const items = document.querySelectorAll('.file-item');
            const cols = getGridColumns();

            switch (e.key) {
                case 'ArrowDown':
                    e.preventDefault();
                    moveFocus(viewMode === 'list' ? 1 : cols);
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    moveFocus(viewMode === 'list' ? -1 : -cols);
                    break;
                case 'ArrowRight':
                    if (viewMode === 'grid') {
                        e.preventDefault();
                        moveFocus(1);
                    }
                    break;
                case 'ArrowLeft':
                    if (viewMode === 'grid') {
                        e.preventDefault();
                        moveFocus(-1);
                    }
                    break;
                case ' ':
                    e.preventDefault();
                    if (focusedIndex >= 0 && focusedIndex < items.length) {
                        const path = items[focusedIndex].dataset.path;
                        toggleSelection(path);
                        lastSelectedIndex = focusedIndex;
                    }
                    break;
                case 'Enter':
                    e.preventDefault();
                    if (focusedIndex >= 0 && focusedIndex < items.length) {
                        const item = items[focusedIndex];
                        const path = item.dataset.path;
                        const isDir = item.dataset.isDir === 'true';
                        handleItemDblClick(e, path, isDir);
                    }
                    break;
                case 'Backspace':
                    e.preventDefault();
                    if (currentPath) {
                        const parts = currentPath.split('/');
                        parts.pop();
                        navigate(parts.join('/'));
                    }
                    break;
                case 'Escape':
                    e.preventDefault();
                    clearSelection();
                    focusedIndex = -1;
                    updateFocusUI();
                    break;
                case 'a':
                    if (e.metaKey || e.ctrlKey) {
                        e.preventDefault();
                        items.forEach(item => selectedFiles.add(item.dataset.path));
                        updateSelectionUI();
                    }
                    break;
                case '/':
                case 'f':
                    if (e.key === '/' || (e.key === 'f' && (e.metaKey || e.ctrlKey))) {
                        e.preventDefault();
                        openGlobalSearch();
                    }
                    break;
                case '0':
                    if (selectedFiles.size > 0) {
                        e.preventDefault();
                        bulkDelete();
                    }
                    break;

            document.getElementById('globalSearch').classList.remove('active');

        async function performGlobalSearch(query) {
            if (!query.trim()) {
                document.getElementById('globalSearchResults').innerHTML = '';
                globalSearchResults = [];
                globalSearchFocusIndex = -1;
                return;
            }

            try {
                const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                globalSearchResults = await res.json();
                renderGlobalSearchResults();
            } catch (err) {
                console.error('Search failed:', err);
            }
        }

        function renderGlobalSearchResults() {
            const container = document.getElementById('globalSearchResults');

            if (globalSearchResults.length === 0) {
                container.innerHTML = `
                    <div class="search-no-results">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <p>No files found</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = globalSearchResults.map((result, index) => {
                const icon = getFileIcon(result.name, result.is_dir);
                const parentPath = result.path.includes('/')
                    ? '/' + result.path.substring(0, result.path.lastIndexOf('/'))
                    : '/';
                const focusedClass = index === globalSearchFocusIndex ? 'focused' : '';

                return `
                    <div class="search-result-item ${focusedClass}"
                         data-path="${escapeAttr(result.path)}"
                         data-is-dir="${result.is_dir}"
                         onclick="openSearchResult('${escapeAttr(result.path)}', ${result.is_dir})">
                        <div class="search-result-icon">${icon}</div>
                        <div class="search-result-info">
                            <div class="search-result-name">${escapeHtml(result.name)}</div>
                            <div class="search-result-path">${escapeHtml(parentPath)}</div>
                        </div>
                        <div class="search-result-meta">${result.is_dir ? 'Folder' : formatSize(result.size)}</div>
                    </div>
                `;
            }).join('');
        }

        function openSearchResult(path, isDir) {
            closeGlobalSearch();
            if (isDir) {
                navigate(path);
            } else {
                // Navigate to parent folder and highlight file
                const parts = path.split('/');
                const filename = parts.pop();
                const parentPath = parts.join('/');
                currentPath = parentPath;
                loadFiles().then(() => {
                    // Select and focus the file
                    selectedFiles.clear();
                    selectedFiles.add(path);
                    updateSelectionUI();
                    focusedIndex = getItemIndex(path);
                    updateFocusUI();
                });
            }
        }

        function updateGlobalSearchFocus() {
            document.querySelectorAll('.search-result-item').forEach((el, i) => {
                el.classList.toggle('focused', i === globalSearchFocusIndex);
            });
            const focused = document.querySelector('.search-result-item.focused');
            if (focused) focused.scrollIntoView({ block: 'nearest' });
        }

        document.getElementById('globalSearchInput').addEventListener('keydown', (e) => {
            switch (e.key) {

                    e.preventDefault();
                    if (globalSearchResults.length > 0) {
                        globalSearchFocusIndex = Math.min(globalSearchFocusIndex + 1, globalSearchResults.length - 1);
                        updateGlobalSearchFocus();
                    }
                    break;
                case 'ArrowUp':
                    e.preventDefault();
                    if (globalSearchResults.length > 0) {
                        globalSearchFocusIndex = Math.max(globalSearchFocusIndex - 1, 0);
                        updateGlobalSearchFocus();
                    }
                    break;
                case 'Enter':
                    e.preventDefault();
                    if (globalSearchFocusIndex >= 0 && globalSearchFocusIndex < globalSearchResults.length) {
                        const result = globalSearchResults[globalSearchFocusIndex];
                        openSearchResult(result.path, result.is_dir);

                    break;
                case 'Escape':
                    e.preventDefault();

        function renderSidebarNodes(nodes, depth) {
            let html = '';
            nodes.forEach(node => {
                const hasChildren = node.children && node.children.length > 0;
                const isExpanded = sidebarExpanded.has(node.path);
                const isActive = currentPath === node.path;

        async function toggleSidebarExpand(path) {
            if (sidebarExpanded.has(path)) {

                    try {
                        const res = await fetch(`/api/files?path=${encodeURIComponent(path)}`);
                        if (res.ok) {
                            const all = await res.json();
                            sidebarFileChildren[path] = all.filter(f => !f.is_dir);
                        } else sidebarFileChildren[path] = [];
                    } catch { sidebarFileChildren[path] = []; }

            }

            renderSidebar();

        // ============================================
        // INLINE RENAME (no modal)
        // ============================================
        function startInlineRename(itemEl) {
            if (!itemEl) return;
            const nameEl = itemEl.querySelector('.file-name');
            if (!nameEl || itemEl.querySelector('.inline-rename')) return;
            const oldPath = itemEl.dataset.path;
            const current = nameEl.textContent;
            const input = document.createElement('input');
            input.className = 'inline-rename';
            input.value = current;
            nameEl.replaceWith(input);
            input.focus();
            const dot = current.lastIndexOf('.');
            input.setSelectionRange(0, dot > 0 ? dot : current.length);
            let done = false;
            const restore = () => { if (!done) { done = true; input.replaceWith(nameEl); } };
            const commit = async () => {
                if (done) return;
                const newName = input.value.trim();
                if (!newName || newName === current) { restore(); return; }
                done = true;
                try {
                    const res = await fetch('/api/rename', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ path: oldPath, new_name: newName }) });
                    if (res.ok) { showToast(`Renamed to ${newName}`, 'success'); loadFiles(); }
                    else { showToast('Rename failed', 'error'); input.replaceWith(nameEl); }
                } catch { showToast('Rename failed', 'error'); input.replaceWith(nameEl); }
            };
            input.addEventListener('keydown', (e) => {
                e.stopPropagation();
                if (e.key === 'Enter') { e.preventDefault(); commit(); }
                else if (e.key === 'Escape') { e.preventDefault(); restore(); }
            });
            input.addEventListener('blur', commit);
        }

        function showTileModal(tileId) {
            const modal = document.getElementById('tileModal');
            const title = document.getElementById('tileModalTitle');
            const nameInput = document.getElementById('tileName');
            const urlInput = document.getElementById('tileUrl');
            const iconInput = document.getElementById('tileIcon');
            const iconUrlInput = document.getElementById('tileIconUrl');
            const editIdInput = document.getElementById('tileEditId');

            if (tileId) {
                const tile = dashboardTiles.find(t => t.id === tileId);
                if (tile) {
                    title.textContent = 'Edit Tile';
                    nameInput.value = tile.name;
                    urlInput.value = tile.url;
                    iconInput.value = tile.icon || '';
                    iconUrlInput.value = tile.iconUrl || '';
                    editIdInput.value = tileId;
                }
            } else {
                title.textContent = 'Add Tile';
                nameInput.value = '';
                urlInput.value = '';
                iconInput.value = '';
                iconUrlInput.value = '';
                editIdInput.value = '';
            }

            modal.classList.add('active');
            nameInput.focus();
        }

        function closeTileModal() {
            document.getElementById('tileModal').classList.remove('active');
        }

        let savingTile = false; // Guard against duplicate saves
        function saveTile() {
            if (savingTile) return; // Prevent double execution
            savingTile = true;

            const name = document.getElementById('tileName').value.trim();
            let url = document.getElementById('tileUrl').value.trim();
            const icon = document.getElementById('tileIcon').value.trim();
            const iconUrl = document.getElementById('tileIconUrl').value.trim();
            const editId = document.getElementById('tileEditId').value;

            if (!name || !url) {
                showToast('Name and URL are required');
                savingTile = false;
                return;
            }

            // Auto-add https if missing
            if (!/^https?:\/\//i.test(url)) {
                url = 'https://' + url;
            }

            if (editId) {
                const tile = dashboardTiles.find(t => t.id === editId);
                if (tile) {
                    tile.name = name;
                    tile.url = url;
                    tile.icon = icon;
                    tile.iconUrl = iconUrl;
                }
            } else {
                dashboardTiles.push({
                    id: Date.now().toString(36),
                    name,
                    url,
                    icon,
                    iconUrl
                });
            }

            saveTiles();
            closeTileModal();
            renderDashboard();
            showToast(editId ? 'Tile updated' : 'Tile added');
            savingTile = false; // Reset guard
        }

        function editTile(tileId) {
            showTileModal(tileId);
        }

        function deleteTile(tileId) {
            if (!confirm('Delete this tile?')) return;
            dashboardTiles = dashboardTiles.filter(t => t.id !== tileId);
            saveTiles();
            renderDashboard();
            showToast('Tile deleted');
        }

        // Tile modal keyboard handling
        document.getElementById('tileName').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                document.getElementById('tileUrl').focus();
            }
            if (e.key === 'Escape') closeTileModal();
        });
        document.getElementById('tileUrl').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                document.getElementById('tileIcon').focus();
            }
            if (e.key === 'Escape') closeTileModal();
        });
        document.getElementById('tileIcon').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                document.getElementById('tileIconUrl').focus();
            }
            if (e.key === 'Escape') closeTileModal();
        });
        document.getElementById('tileIconUrl').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                e.stopPropagation();
                saveTile();
            }
            if (e.key === 'Escape') closeTileModal();
        });

        // Dashboard tile drag-and-drop (optimized)
        let tileDragState = null;
        let tileGhostEl = null;
        let tilePlaceholderEl = null;
        let cachedTileRects = null;
        let tileDragRafId = null;

        function startTileDrag(e, tileId) {
            // Ignore if clicking on action buttons
            if (e.target.closest('.dashboard-tile-btn')) return;
            if (e.button !== 0) return; // Only left click

            const tile = e.target.closest('.dashboard-tile');
            if (!tile || tile.classList.contains('dashboard-add-tile')) return;

            e.preventDefault();

            const rect = tile.getBoundingClientRect();
            const grid = document.getElementById('dashboardGrid');

            // Cache all tile positions at drag start (avoid DOM queries during drag)
            cachedTileRects = [...grid.querySelectorAll('.dashboard-tile:not(.dashboard-add-tile)')]
                .map(t => ({
                    el: t,
                    id: t.dataset.tileId,
                    rect: t.getBoundingClientRect()
                }));

            tileDragState = {
                tileId,
                startX: e.clientX,
                startY: e.clientY,
                offsetX: e.clientX - rect.left,
                offsetY: e.clientY - rect.top,
                width: rect.width,
                height: rect.height,
                isDragging: false,
                originalTile: tile,
                lastX: e.clientX,
                lastY: e.clientY
            };

            // Attach listeners to document for reliable capture
            document.addEventListener('pointermove', onTileDragMove);
            document.addEventListener('pointerup', onTileDragEnd);
            document.addEventListener('pointercancel', onTileDragEnd);
        }

        function initTileDragVisuals() {
            tileDragState.isDragging = true;
            const tile = tileDragState.originalTile;
            const grid = document.getElementById('dashboardGrid');

            grid.classList.add('is-dragging');
            tile.classList.add('dragging');

            // Create ghost element
            tileGhostEl = tile.cloneNode(true);
            tileGhostEl.classList.remove('dragging');
            tileGhostEl.classList.add('drag-ghost');

            // Clear inherited transitions to prevent animation from origin
            tileGhostEl.style.animation = 'none';
            tileGhostEl.style.transition = 'none';
            tileGhostEl.style.width = tileDragState.width + 'px';
            tileGhostEl.style.height = tileDragState.height + 'px';

            // Position BEFORE appending to prevent flash at origin
            const initialX = tileDragState.lastX - tileDragState.offsetX;
            const initialY = tileDragState.lastY - tileDragState.offsetY;
            tileGhostEl.style.transform = `translate(${initialX}px, ${initialY}px) scale(1.02) rotate(1deg)`;

            document.body.appendChild(tileGhostEl);

            // Create placeholder
            tilePlaceholderEl = document.createElement('div');
            tilePlaceholderEl.className = 'dashboard-tile dashboard-tile-placeholder';
            tilePlaceholderEl.style.width = tileDragState.width + 'px';
            tilePlaceholderEl.style.height = tileDragState.height + 'px';
            tile.parentNode.insertBefore(tilePlaceholderEl, tile);

            // Hide original
            tile.style.display = 'none';

            // Initial position
            updateTileDragPosition();
        }

        function onTileDragMove(e) {
            if (!tileDragState) return;

            // Always update position first (before checking isDragging)
            tileDragState.lastX = e.clientX;
            tileDragState.lastY = e.clientY;

            const dx = Math.abs(e.clientX - tileDragState.startX);
            const dy = Math.abs(e.clientY - tileDragState.startY);

            // Start drag if moved enough (8px threshold)
            if (!tileDragState.isDragging && (dx > 8 || dy > 8)) {
                initTileDragVisuals();
                // Immediately update position (don't wait for RAF)
                updateTileDragPosition();
                return;
            }

            // Use RAF for smooth 60fps updates on subsequent moves
            if (tileDragState.isDragging && !tileDragRafId) {
                tileDragRafId = requestAnimationFrame(updateTileDragPosition);
            }
        }

        function updateTileDragPosition() {
            tileDragRafId = null;
            if (!tileDragState || !tileDragState.isDragging) return;

            const x = tileDragState.lastX - tileDragState.offsetX;
            const y = tileDragState.lastY - tileDragState.offsetY;

            // Use transform for GPU-accelerated positioning
            if (tileGhostEl) {
                tileGhostEl.style.transform = `translate(${x}px, ${y}px) scale(1.02) rotate(1deg)`;
            }

            // Update placeholder position
            updateTilePlaceholderPosition(tileDragState.lastX, tileDragState.lastY);
        }

        function updateTilePlaceholderPosition(x, y) {
            if (!tilePlaceholderEl || !cachedTileRects) return;

            const grid = document.getElementById('dashboardGrid');
            if (!grid) return;

            // Find insertion point based on cursor position
            // Use 33% threshold for more responsive feel (like task cards)
            let insertBeforeEl = null;

            for (const item of cachedTileRects) {
                if (item.id === tileDragState.tileId) continue;

                // For horizontal grid: use left third of tile as threshold
                const thresholdX = item.rect.left + item.rect.width * 0.33;
                // For vertical positioning: use top third
                const thresholdY = item.rect.top + item.rect.height * 0.33;

                // Insert before this tile if cursor is in the left/top region
                if (x < thresholdX && y < item.rect.bottom) {
                    insertBeforeEl = item.el;
                    break;
                }
                // Also handle vertical stacking (when tiles wrap to next row)
                if (y < thresholdY && x >= item.rect.left && x <= item.rect.right) {
                    insertBeforeEl = item.el;
                    break;
                }
            }

            // Move placeholder only if position changed
            if (insertBeforeEl) {
                if (tilePlaceholderEl.nextElementSibling !== insertBeforeEl) {
                    grid.insertBefore(tilePlaceholderEl, insertBeforeEl);
                }
            } else {
                // Insert before the add-tile button
                const addTile = grid.querySelector('.dashboard-add-tile');
                if (addTile && tilePlaceholderEl.nextElementSibling !== addTile) {
                    grid.insertBefore(tilePlaceholderEl, addTile);
                }
            }
        }

        function onTileDragEnd(e) {
            // Remove document listeners
            document.removeEventListener('pointermove', onTileDragMove);
            document.removeEventListener('pointerup', onTileDragEnd);
            document.removeEventListener('pointercancel', onTileDragEnd);

            // Cancel any pending RAF
            if (tileDragRafId) {
                cancelAnimationFrame(tileDragRafId);
                tileDragRafId = null;
            }

            if (!tileDragState) return;

            const grid = document.getElementById('dashboardGrid');
            if (grid) grid.classList.remove('is-dragging');

            if (tileDragState.isDragging) {
                const tile = tileDragState.originalTile;
                tile.classList.remove('dragging');
                tile.style.display = '';

                // Remove ghost
                if (tileGhostEl) {
                    tileGhostEl.remove();
                    tileGhostEl = null;
                }

                // Commit reorder based on placeholder position
                if (tilePlaceholderEl && tilePlaceholderEl.parentNode) {
                    // Build new order from current DOM state
                    const newOrder = [];
                    const allElements = grid.querySelectorAll('.dashboard-tile:not(.dashboard-add-tile), .dashboard-tile-placeholder');

                    allElements.forEach(el => {
                        if (el === tilePlaceholderEl) {
                            // Insert dragged tile at placeholder position
                            const draggedTile = dashboardTiles.find(t => t.id === tileDragState.tileId);
                            if (draggedTile) newOrder.push(draggedTile);
                        } else if (el.dataset.tileId && el.dataset.tileId !== tileDragState.tileId) {
                            const t = dashboardTiles.find(tile => tile.id === el.dataset.tileId);
                            if (t) newOrder.push(t);
                        }
                    });

                    dashboardTiles = newOrder;
                    saveTiles();

                    tilePlaceholderEl.remove();
                    tilePlaceholderEl = null;

                    renderDashboard();
                }
            }

            tileDragState = null;
            cachedTileRects = null;
        }

        // ============================================
        // CREDENTIALS
        // ============================================
        let credentials = [];
        let revealedPasswords = new Set();

        async function loadCredentials() {
            const serverCreds = await loadServerData('credentials');

            if (serverCreds && Array.isArray(serverCreds)) {
                credentials = serverCreds;
            } else {
                // Migration from localStorage
                const localCreds = ls.get('boxy_credentials');
                if (localCreds) {
                    credentials = JSON.parse(localCreds);
                    await saveServerData('credentials', credentials);
                    ls.set('boxy_credentials', '');
                } else {
                    credentials = [];
                }
            }
        }

        async function saveCredentials() {
            await saveServerData('credentials', credentials);
        }

        function renderCredentials() {
            const list = document.getElementById('credentialsList');
            if (!list) return;

            if (credentials.length === 0) {
                list.innerHTML = `
                    <div class="credentials-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <p>No credentials stored</p>
                        <button class="btn btn-primary" onclick="showCredentialModal()" style="margin-top: 16px">
                            Add Your First Credential
                        </button>
                    </div>
                `;
                return;
            }

            list.innerHTML = credentials.map(cred => {
                const isRevealed = revealedPasswords.has(cred.id);
                const passwordDisplay = isRevealed ? escapeHtml(cred.password) : '••••••••';
                return `
                    <div class="credential-card">
                        <div class="credential-header">
                            <div class="credential-title">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                                </svg>
                                ${escapeHtml(cred.title)}
                            </div>
                            <div class="credential-actions">
                                <button class="credential-btn" onclick="editCredential('${cred.id}')" title="Edit">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                                    </svg>
                                </button>
                                <button class="credential-btn danger" onclick="deleteCredential('${cred.id}')" title="Delete">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="credential-fields">
                            ${cred.username ? `
                            <div class="credential-field">
                                <span class="credential-field-label">Username</span>
                                <div class="credential-field-value">
                                    <span>${escapeHtml(cred.username)}</span>
                                    <button class="credential-copy-btn" onclick="copyToClipboard('${escapeAttr(cred.username)}')" title="Copy">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            ` : ''}
                            ${cred.password ? `
                            <div class="credential-field">
                                <span class="credential-field-label">Password</span>
                                <div class="credential-field-value ${isRevealed ? '' : 'masked'}">
                                    <span>${passwordDisplay}</span>
                                    <div style="display: flex; gap: 4px;">
                                        <button class="credential-copy-btn" onclick="togglePasswordReveal('${cred.id}')" title="${isRevealed ? 'Hide' : 'Show'}">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                ${isRevealed ?
                                                    '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>' :
                                                    '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
                                                }
                                            </svg>
                                        </button>
                                        <button class="credential-copy-btn" onclick="copyToClipboard('${escapeAttr(cred.password)}')" title="Copy">
                                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            ` : ''}
                            ${cred.url ? `
                            <div class="credential-field">
                                <span class="credential-field-label">URL</span>
                                <div class="credential-field-value">
                                    <a href="${escapeAttr(cred.url)}" target="_blank" style="color: var(--accent); text-decoration: none;">${escapeHtml(cred.url)}</a>
                                    <button class="credential-copy-btn" onclick="copyToClipboard('${escapeAttr(cred.url)}')" title="Copy">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            ` : ''}
                        </div>
                        ${cred.notes ? `<div class="credential-notes">${escapeHtml(cred.notes)}</div>` : ''}
                    </div>
                `;
            }).join('');
        }

        function togglePasswordReveal(credId) {
            if (revealedPasswords.has(credId)) {
                revealedPasswords.delete(credId);
            } else {
                revealedPasswords.add(credId);
            }
            renderCredentials();
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('Copied to clipboard');
            }).catch(() => {
                showToast('Failed to copy');
            });
        }

        function showCredentialModal(credId) {
            const modal = document.getElementById('credentialModal');
            const title = document.getElementById('credentialModalTitle');
            const titleInput = document.getElementById('credentialTitle');
            const usernameInput = document.getElementById('credentialUsername');
            const passwordInput = document.getElementById('credentialPassword');
            const urlInput = document.getElementById('credentialUrl');
            const notesInput = document.getElementById('credentialNotes');
            const editIdInput = document.getElementById('credentialEditId');

            if (credId) {
                const cred = credentials.find(c => c.id === credId);
                if (cred) {
                    title.textContent = 'Edit Credential';
                    titleInput.value = cred.title;
                    usernameInput.value = cred.username || '';
                    passwordInput.value = cred.password || '';
                    urlInput.value = cred.url || '';
                    notesInput.value = cred.notes || '';
                    editIdInput.value = credId;
                }
            } else {
                title.textContent = 'Add Credential';
                titleInput.value = '';
                usernameInput.value = '';
                passwordInput.value = '';
                urlInput.value = '';
                notesInput.value = '';
                editIdInput.value = '';
            }

            modal.classList.add('active');
            titleInput.focus();
        }

        function closeCredentialModal() {
            document.getElementById('credentialModal').classList.remove('active');
        }

        function saveCredential() {
            const title = document.getElementById('credentialTitle').value.trim();
            const username = document.getElementById('credentialUsername').value.trim();
            const password = document.getElementById('credentialPassword').value;
            const url = document.getElementById('credentialUrl').value.trim();
            const notes = document.getElementById('credentialNotes').value.trim();
            const editId = document.getElementById('credentialEditId').value;

            if (!title) {
                showToast('Title is required');
                return;
            }

            if (editId) {
                const cred = credentials.find(c => c.id === editId);
                if (cred) {
                    cred.title = title;
                    cred.username = username;
                    cred.password = password;
                    cred.url = url;
                    cred.notes = notes;
                    cred.updatedAt = Date.now();
                }
            } else {
                credentials.push({
                    id: Date.now().toString(36),
                    title,
                    username,
                    password,
                    url,
                    notes,
                    createdAt: Date.now()
                });
            }

            saveCredentials();
            closeCredentialModal();
            renderCredentials();
            showToast(editId ? 'Credential updated' : 'Credential added');
        }

        function editCredential(credId) {
            showCredentialModal(credId);
        }

        function deleteCredential(credId) {
            if (!confirm('Delete this credential?')) return;
            credentials = credentials.filter(c => c.id !== credId);
            saveCredentials();
            renderCredentials();
            showToast('Credential deleted');
        }

        // Credential modal keyboard handling
        document.getElementById('credentialTitle').addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeCredentialModal();
        });
        document.getElementById('credentialPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                saveCredential();
            }
            if (e.key === 'Escape') closeCredentialModal();
        });

        // ============================================
        // END DASHBOARD & CREDENTIALS
        // ============================================

        // Init
        document.getElementById('filterSelect').value = filterType;
        updateViewIcon();
        if (ls.get('boxy_sidebar_collapsed') === '1') {
            document.getElementById('filesSidebar').classList.add('collapsed');
        }
        // URL hash routing
        window.addEventListener('popstate', () => {
            const hash = location.hash.slice(1);
            const path = (hash && hash !== '/') ? hash : '';
            currentPath = path;
            loadFiles();
            updateBreadcrumb();
        });
        // Restore path from URL hash on load
        const initialHash = location.hash.slice(1);
        if (initialHash && initialHash !== '/') {
            currentPath = initialHash;
        }

        // Zoom slider init
        const zoomSlider = document.getElementById('zoomSlider');
        if (zoomSlider) {
            zoomSlider.value = itemScale;
            zoomSlider.addEventListener('input', e => setItemScale(e.target.value));
        }

        // Path bar keyboard nav
        const pathBarEl = document.getElementById('pathBar');
        if (pathBarEl) {
            pathBarEl.addEventListener('keydown', e => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    let val = pathBarEl.value.trim().replace(/^\/+/, '').replace(/\/+$/, '');
                    navigate(val);
                }
                if (e.key === 'Escape') {
                    updatePathBar();
                    pathBarEl.blur();
                }
            });
            pathBarEl.addEventListener('blur', updatePathBar);
        }

        // Sidebar files toggle button state
        const sftBtn = document.getElementById('sidebarFilesToggleBtn');
        if (sftBtn) sftBtn.classList.toggle('active', sidebarShowFiles);

        // Lightbox keyboard nav
        document.addEventListener('keydown', e => {
            const lb = document.getElementById('lightbox');
            if (!lb || !lb.classList.contains('show')) return;
            if (e.key === 'ArrowLeft') lightboxNav(-1);
            if (e.key === 'ArrowRight') lightboxNav(1);
            if (e.key === 'Escape') { document.getElementById('lightbox').classList.remove('show'); document.body.style.overflow = ''; }
        });

        showSkeleton();
        connectWS();
        loadFiles();
        loadSidebarTree();
    </script>
