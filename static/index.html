<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxy - File Sharing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f3f1ed;
            --bg-secondary: #ffffff;
            --bg-tertiary: #ece9e3;
            --border: #d8d2c9;
            --text: #1a1a1a;
            --text-secondary: #6d6d6d;
            --accent: #2f6df6;
            --accent-hover: #2a61d9;
            --danger: #ff3b30;
            --success: #34c759;
            --shadow: rgba(0,0,0,0.08);
            --shadow-lg: rgba(0,0,0,0.12);
            --folder: #64b5f6;
            --transition: 0.2s ease;
            --warm: #f6c28b;
            /* Standardized radii */
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-xl: 18px;
            /* Motion tokens */
            --ease: cubic-bezier(.22,.61,.36,1);
            --motion-fast: 0.12s;
            --motion: 0.22s;
            /* Priority / status accents (themeable) */
            --priority-high: #ff453a;
            --priority-medium: #f5a623;
            --priority-low: #34c759;
            /* Layout tokens */
            --sidebar-width: 232px;
            --z-menu: 250;
        }

        [data-theme="dark"] {
            --bg: #131416;
            --bg-secondary: #1e2024;
            --bg-tertiary: #292d34;
            --border: #32363f;
            --text: #f0ede8;
            --text-secondary: #9fa3ab;
            --shadow: rgba(0,0,0,0.35);
            --shadow-lg: rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Space Grotesk', 'Segoe UI', sans-serif;
            background: radial-gradient(1200px 600px at -10% -10%, rgba(246, 194, 139, 0.4), transparent 60%),
                        radial-gradient(800px 500px at 110% -10%, rgba(47, 109, 246, 0.2), transparent 60%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: linear-gradient(120deg, rgba(0,0,0,0.03) 0%, rgba(0,0,0,0.01) 40%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 600;
            font-family: 'Fraunces', serif;
        }

        .logo svg { width: 26px; height: 26px; color: var(--accent); }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--danger);
            transition: background var(--transition);
        }

        .status-dot.connected { background: var(--success); }

        /* Theme Toggle */
        .theme-toggle {
            width: 40px;
            height: 40px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .theme-toggle:hover {
            background: var(--bg-tertiary);
            color: var(--text);
            border-color: var(--text-secondary);
        }
        .theme-toggle svg { width: 20px; height: 20px; }

        /* Main Layout */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        /* Sticky Navigation Bar */
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 10px 16px;
            margin: 0 -24px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 57px;
            z-index: 40;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            overflow-x: auto;
        }

        .breadcrumb-item {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--text-secondary);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            white-space: nowrap;
            transition: all var(--transition);
        }

        .breadcrumb-item:hover { background: var(--bg-tertiary); color: var(--text); }
        .breadcrumb-item.active { color: var(--text); font-weight: 500; background: var(--bg-tertiary); }
        .breadcrumb-sep { color: var(--border); }

        .nav-meta {
            font-size: 13px;
            color: var(--text-secondary);
            white-space: nowrap;
        }

        /* Path address bar (1G) */
        .path-bar {
            flex: 1;
            min-width: 0;
            max-width: 400px;
            font-size: 13px;
            padding: 5px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'SF Mono', 'Consolas', monospace;
            outline: none;
            transition: border-color var(--transition);
        }
        .path-bar:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47,109,246,0.12);
        }

        .toolbar-actions { display: flex; gap: 8px; }

        .view-toggle {
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .view-toggle:hover {
            background: var(--bg-tertiary);
            color: var(--text);
            border-color: var(--text-secondary);
        }
        .view-toggle svg { width: 18px; height: 18px; }

        /* CSS Tooltips */
        [data-tip] { position: relative; }
        [data-tip]::after {
            content: attr(data-tip);
            position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%);
            background: var(--bg-tertiary); color: var(--text); border: 1px solid var(--border);
            font-size: 11px; font-weight: 500; white-space: nowrap; pointer-events: none;
            padding: 4px 8px; border-radius: 4px; box-shadow: 0 4px 12px var(--shadow);
            opacity: 0; transition: opacity 0.15s ease; z-index: 500;
        }
        [data-tip]:hover::after { opacity: 1; }

        /* Multi-select active state (1I) */
        .view-toggle.active {
            background: color-mix(in srgb, var(--accent) 16%, var(--bg-secondary));
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Zoom slider (1H) */
        .zoom-control {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
        }
        .zoom-control svg { color: var(--text-secondary); flex-shrink: 0; }
        .zoom-slider {
            -webkit-appearance: none; appearance: none;
            width: 80px; height: 4px;
            background: var(--bg-tertiary); border-radius: 2px; outline: none; cursor: pointer;
        }
        .zoom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); border: 2px solid var(--bg-secondary);
            box-shadow: 0 1px 4px rgba(0,0,0,0.3); cursor: grab;
            transition: transform var(--motion-fast) ease;
        }
        .zoom-slider::-webkit-slider-thumb:active { cursor: grabbing; transform: scale(1.2); }
        .zoom-slider::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); border: 2px solid var(--bg-secondary); cursor: grab;
        }
        .toolbar-search {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 8px 14px;
        }

        .toolbar-search input, .toolbar-search select {
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 13px;
            outline: none;
        }

        .toolbar-search input {
            width: 180px;
        }

        .toolbar-search select {
            padding-left: 10px;
            border-left: 1px solid var(--border);
        }

        .btn {
            padding: 10px 16px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition);
        }

        .btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-secondary);
        }
        .btn svg { width: 16px; height: 16px; }

        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        /* Drop Zone */
        .drop-zone {
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 28px;
            text-align: center;
            margin-bottom: 20px;
            transition: all var(--transition);
            background: var(--bg-secondary);
            animation: fadeUp 0.5s ease;
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(47, 109, 246, 0.06);
        }

        .drop-zone-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 12px;
            color: var(--text-secondary);
        }

        .drop-zone p { color: var(--text-secondary); font-size: 14px; }

        /* File Grid */
        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
        }

        .file-item {
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            padding: 16px 12px 44px;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            text-align: center;
            border: 1px solid var(--border);
            user-select: none;
            overflow: hidden;
            animation: fadeUp 0.4s ease both;
        }

        .file-item:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-secondary);
            box-shadow: 0 4px 16px var(--shadow);
            transform: translateY(-1px);
        }

        .file-item-content {
            cursor: pointer;
        }

        .file-item.drag-over {
            border-color: var(--accent);
            background: rgba(47, 109, 246, 0.08);
        }

        .file-item.dragging {
            opacity: 0.5;
            transform: scale(0.97);
        }

        .file-item.selected {
            border-color: var(--accent);
            background: rgba(47, 109, 246, 0.12);
            box-shadow: inset 0 0 0 1.5px rgba(47, 109, 246, 0.4);
        }

        .file-item.focused {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(47, 109, 246, 0.2);
        }

        .file-item.focused.selected {
            box-shadow: 0 0 0 2px rgba(47, 109, 246, 0.3);
        }

        /* File Icons */
        .file-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .file-icon svg { width: 48px; height: 48px; }

        .file-icon-ext {
            position: absolute;
            bottom: 4px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            background: var(--bg-tertiary);
            padding: 2px 5px;
            border-radius: 3px;
            color: var(--text-secondary);
        }

        /* Thumbnail */
        .file-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 6px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .file-thumb.loaded {
            opacity: 1;
        }

        .file-icon.has-thumb {
            background: var(--bg-tertiary);
            border-radius: 6px;
            overflow: hidden;
        }

        .file-list .file-icon.has-thumb {
            border-radius: 4px;
        }

        /* Icon Colors */
        .icon-folder { color: var(--folder); }
        .icon-image { color: #e91e63; }
        .icon-pdf { color: #f44336; }
        .icon-doc { color: #2196f3; }
        .icon-sheet { color: #4caf50; }
        .icon-code { color: #ff9800; }
        .icon-video { color: #9c27b0; }
        .icon-audio { color: #00bcd4; }
        .icon-archive { color: #795548; }
        .icon-file { color: var(--text-secondary); }

        .file-name {
            font-size: 13px;
            font-weight: 500;
            word-break: break-word;
            line-height: 1.3;
            max-height: 2.6em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .file-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* List View Table */
        .file-table {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .file-table-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            font-size: 11.5px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--text-secondary);
            gap: 12px;
        }

        .file-table-header .col {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 8px;
            margin: -4px -8px;
            border-radius: 4px;
            transition: all var(--transition);
            user-select: none;
            position: relative;
        }

        .file-table-header .col:hover {
            background: var(--border);
            color: var(--text);
        }

        .file-table-header .col.sorted {
            color: var(--accent);
        }

        .file-table-header .sort-arrow {
            width: 12px;
            height: 12px;
            opacity: 0;
            transition: all var(--transition);
        }

        .file-table-header .col.sorted .sort-arrow {
            opacity: 1;
        }

        .file-table-header .col.sorted.desc .sort-arrow {
            transform: rotate(180deg);
        }

        .file-table-header .col-icon {
            width: 32px;
            flex-shrink: 0;
        }

        .file-table-header .col-name {
            flex: 1;
            min-width: 0;
            padding-left: 44px;
        }

        .file-table-header .col-type {
            width: 100px;
            flex-shrink: 0;
        }

        .file-table-header .col-size {
            width: 80px;
            text-align: right;
            flex-shrink: 0;
        }

        .file-table-header .col-date-part {
            width: 100px;
            flex-shrink: 0;
            text-align: right;
        }
        .file-table-header .col-time-part {
            width: 80px;
            flex-shrink: 0;
            text-align: right;
        }

        .file-table-header .col-actions {
            width: 196px;
            flex-shrink: 0;
        }

        .file-table-body {
            display: flex;
            flex-direction: column;
        }

        .file-table .file-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: 0;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .file-table .file-item:last-child {
            border-bottom: none;
        }

        .file-table .file-item:hover {
            background: var(--bg-tertiary);
            box-shadow: none;
        }

        .file-table .file-item-content {
            display: flex;
            align-items: center;
            flex: 1;
            gap: 12px;
            min-width: 0;
        }

        .file-table .file-icon {
            width: 32px;
            height: 32px;
            margin: 0;
            flex-shrink: 0;
        }

        .file-table .file-icon svg {
            width: 28px;
            height: 28px;
        }

        .file-table .file-name {
            flex: 1;
            min-width: 0;
            max-height: none;
            -webkit-line-clamp: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-table .file-type {
            font-size: 12px;
            color: var(--text-secondary);
            width: 100px;
            flex-shrink: 0;
        }

        .file-table .file-meta {
            margin-top: 0;
            width: 80px;
            text-align: right;
            flex-shrink: 0;
        }

        .file-table .file-date-part {
            font-size: 12px;
            color: var(--text-secondary);
            width: 100px;
            text-align: right;
            flex-shrink: 0;
        }
        .file-table .file-time-part {
            font-size: 12px;
            color: var(--text-secondary);
            width: 80px;
            text-align: right;
            flex-shrink: 0;
        }

        .file-table .file-actions {
            position: static;
            opacity: 0;
            transform: none;
            background: none;
            padding: 0;
            margin-left: 0;
            pointer-events: none;
            width: 196px;
            flex-shrink: 0;
            justify-content: flex-end;
        }

        .file-table .file-item:hover .file-actions {
            opacity: 1;
            pointer-events: auto;
        }

        /* File Actions - Bottom Bar */
        .file-actions {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding: 8px;
            background: linear-gradient(to top, var(--bg-secondary) 60%, transparent);
            border-radius: 0 0 10px 10px;
            opacity: 0;
            transform: translateY(4px);
            transition: all var(--transition);
            pointer-events: none;
        }

        .file-item:hover .file-actions {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .file-action-btn {
            width: 34px;
            height: 30px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .file-action-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .file-action-btn.delete:hover {
            background: var(--danger);
            border-color: var(--danger);
        }

        .file-action-btn svg { width: 15px; height: 15px; }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 80px 24px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 16px;
            opacity: 0.4;
        }

        .empty-state p { font-size: 15px; }

        /* Global Search */
        .global-search {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 150;
            align-items: flex-start;
            justify-content: center;
            padding-top: 10vh;
        }

        .global-search.active { display: flex; }

        .global-search-panel {
            width: 100%;
            max-width: 600px;
            margin: 0 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: 0 20px 60px var(--shadow-lg);
            overflow: hidden;
        }

        .global-search-input-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }

        .global-search-input-wrap svg {
            width: 20px;
            height: 20px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .global-search-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 16px;
            color: var(--text);
            outline: none;
        }

        .global-search-input::placeholder {
            color: var(--text-secondary);
        }

        .global-search-hint {
            font-size: 12px;
            color: var(--text-secondary);
            padding: 8px 20px;
            background: var(--bg-tertiary);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .global-search-hint kbd {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            border: 1px solid var(--border);
        }

        .global-search-results {
            max-height: 50vh;
            overflow-y: auto;
        }

        .search-result-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            cursor: pointer;
            transition: all var(--transition);
            border-bottom: 1px solid var(--border);
        }

        .search-result-item:last-child { border-bottom: none; }
        .search-result-item:hover { background: var(--bg-tertiary); }
        .search-result-item.focused { background: var(--bg-tertiary); }

        .search-result-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .search-result-icon svg {
            width: 24px;
            height: 24px;
        }

        .search-result-info {
            flex: 1;
            min-width: 0;
        }

        .search-result-name {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-result-path {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-result-meta {
            font-size: 12px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .search-no-results {
            padding: 40px 20px;
            text-align: center;
            color: var(--text-secondary);
        }

        .search-no-results svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 24px;
            width: 100%;
            max-width: 400px;
            margin: 16px;
            box-shadow: 0 20px 60px var(--shadow-lg);
        }

        .modal h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal input, .modal select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 14px;
            margin-bottom: 16px;
            background: var(--bg);
            color: var(--text);
            transition: border-color var(--transition);
        }

        .modal input:focus, .modal select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47, 109, 246, 0.1);
        }

        .modal label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* Move Modal Tree */
        .move-modal-content {
            max-width: 480px;
        }

        /* Edit Modal */
        .edit-modal-content {
            max-width: 80vw;
            width: 900px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .edit-modal-content h3 {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }

        .edit-modal-content h3 code {
            font-family: 'Space Grotesk', monospace;
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--bg-tertiary);
            padding: 4px 8px;
            border-radius: 4px;
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .edit-textarea {
            flex: 1;
            min-height: 400px;
            max-height: 60vh;
            font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Roboto Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            padding: 16px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            background: var(--bg);
            color: var(--text);
            resize: vertical;
            tab-size: 4;
            margin-bottom: 16px;
        }

        .edit-textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(47, 109, 246, 0.1);
        }

        .edit-modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .edit-status {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* New File Modal */
        .new-file-input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .new-file-input-group input {
            flex: 1;
            margin-bottom: 0;
        }

        .new-file-input-group select {
            width: auto;
            min-width: 100px;
            margin-bottom: 0;
        }

        .edit-status.saving {
            color: var(--accent);
        }

        .edit-status.error {
            color: var(--danger);
        }

        /* Syntax Preview (Prism) */
        .syntax-preview {
            display: none;
            margin: 0;
            border-radius: 6px;
            max-height: 60vh;
            overflow: auto;
            font-size: 13px;
        }
        .syntax-preview.active { display: block; }
        .edit-textarea.hidden { display: none; }
        .edit-mode-toggle { display: flex; gap: 8px; margin-bottom: 8px; }
        .edit-mode-btn { padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border); background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 12px; }
        .edit-mode-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .folder-tree {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 16px;
        }

        .tree-item {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            cursor: pointer;
            transition: all var(--transition);
            border-bottom: 1px solid var(--border);
            gap: 8px;
        }

        .tree-item:last-child { border-bottom: none; }

        .tree-item:hover { background: var(--bg-tertiary); }

        .tree-item.selected {
            background: rgba(47, 109, 246, 0.1);
            color: var(--accent);
        }

        .tree-item.selected .tree-folder-icon { color: var(--accent); }

        .tree-item-indent {
            display: flex;
            align-items: center;
        }

        .tree-indent {
            width: 20px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--border);
        }

        .tree-indent::before {
            content: '';
            width: 1px;
            height: 100%;
            background: var(--border);
        }

        .tree-toggle {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .tree-toggle svg {
            width: 14px;
            height: 14px;
            transition: transform var(--transition);
        }

        .tree-toggle.expanded svg { transform: rotate(90deg); }
        .tree-toggle.empty { visibility: hidden; }

        .tree-folder-icon {
            width: 20px;
            height: 20px;
            color: var(--folder);
            flex-shrink: 0;
        }

        .tree-folder-name {
            font-size: 14px;
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .tree-path {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: auto;
            flex-shrink: 0;
        }

        .selected-path {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .selected-path svg {
            width: 16px;
            height: 16px;
            color: var(--folder);
            flex-shrink: 0;
        }

        .selected-path span {
            color: var(--text);
            font-weight: 500;
        }

        /* Selection Action Bar */
        .selection-bar {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px var(--shadow-lg);
            z-index: 100;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .selection-bar.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }

        .selection-count {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            padding-right: 16px;
            border-right: 1px solid var(--border);
        }

        .selection-actions {
            display: flex;
            gap: 8px;
        }

        .selection-btn {
            padding: 8px 16px;
            border: 1px solid var(--border);
            background: var(--bg-secondary);
            color: var(--text);
            border-radius: var(--radius-md);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition);
        }

        .selection-btn:hover {
            background: var(--bg-tertiary);
            border-color: var(--text-secondary);
        }

        .selection-btn.danger {
            color: var(--danger);
        }

        .selection-btn.danger:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        .selection-btn svg {
            width: 16px;
            height: 16px;
        }

        .selection-clear {
            padding: 8px;
            border: none;
            background: none;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition);
        }

        .selection-clear:hover {
            background: var(--bg-tertiary);
            color: var(--text);
        }

        .selection-clear svg {
            width: 18px;
            height: 18px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg-secondary);
            color: var(--text);
            padding: 14px 20px;
            border-radius: var(--radius-lg);
            font-size: 14px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s;
            z-index: 200;
            box-shadow: 0 8px 32px var(--shadow-lg);
            border: 1px solid var(--border);
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Upload Progress */
        .upload-progress {
            position: fixed;
            bottom: 24px;
            left: 24px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            min-width: 300px;
            box-shadow: 0 8px 32px var(--shadow-lg);
            display: none;
        }

        .upload-progress.show { display: block; }
        .upload-progress h4 { font-size: 14px; margin-bottom: 10px; }

        .progress-bar {
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s;
            border-radius: 3px;
        }

        #fileInput { display: none; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Refined dark depth (toned-down blobs) ===== */
        [data-theme="dark"] body {
            background: radial-gradient(1000px 520px at -10% -8%, rgba(246,194,139,0.06), transparent 60%),
                        radial-gradient(720px 460px at 110% -8%, rgba(47,109,246,0.09), transparent 60%),
                        var(--bg);
        }

        /* ===== Files layout + sidebar folder tree ===== */
        .files-layout { display: flex; gap: 18px; align-items: flex-start; width: 100%; }
        .files-content { flex: 1; min-width: 0; }
        .files-content .nav-bar { margin-left: 0; margin-right: 0; }

        .files-sidebar {
            flex: 0 0 var(--sidebar-width);
            width: var(--sidebar-width);
            position: sticky;
            top: 72px;
            align-self: flex-start;
            max-height: calc(100vh - 96px);
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: flex-basis var(--motion) var(--ease), width var(--motion) var(--ease);
        }
        .files-sidebar.collapsed { flex-basis: 44px; width: 44px; }
        .sidebar-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 12px; border-bottom: 1px solid var(--border);
            font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
            color: var(--text-secondary);
        }
        .files-sidebar.collapsed .sidebar-head { justify-content: center; }
        .files-sidebar.collapsed .sidebar-title,
        .files-sidebar.collapsed .sidebar-tree { display: none; }
        .sidebar-toggle {
            background: none; border: none; color: var(--text-secondary); cursor: pointer;
            display: inline-flex; padding: 4px; border-radius: var(--radius-sm); transition: var(--transition);
        }
        .sidebar-toggle:hover { background: var(--bg-tertiary); color: var(--text); }
        .sidebar-toggle svg { width: 16px; height: 16px; transition: transform var(--motion) var(--ease); }
        .files-sidebar.collapsed .sidebar-toggle svg { transform: rotate(180deg); }
        .sidebar-tree { overflow-y: auto; padding: 6px; }

        /* Sidebar toolbar (1L) */
        .sidebar-toolbar {
            display: flex; align-items: center; gap: 4px;
            padding: 6px 8px; border-bottom: 1px solid var(--border);
            background: var(--bg-tertiary);
        }
        .sidebar-tool-btn {
            width: 26px; height: 26px; border: 1px solid transparent; background: none;
            color: var(--text-secondary); cursor: pointer; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            transition: all var(--motion-fast) ease;
        }
        .sidebar-tool-btn:hover { background: var(--bg-secondary); border-color: var(--border); color: var(--text); }
        .sidebar-tool-btn.active { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
        .sidebar-tool-btn svg { width: 13px; height: 13px; }
        .sb-file { opacity: 0.8; }
        .sb-file:hover { opacity: 1; }
        .sb-file svg { width: 13px; height: 13px; color: var(--text-secondary); }
        .sb-item {
            display: flex; align-items: center; gap: 6px; padding: 6px 8px;
            border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
            color: var(--text); transition: background var(--motion-fast) ease;
        }
        .sb-item:hover { background: var(--bg-tertiary); }
        .sb-item.active { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); font-weight: 600; }
        .sb-item.drop-target { background: color-mix(in srgb, var(--accent) 22%, transparent); box-shadow: inset 0 0 0 1.5px var(--accent); }
        .sb-item .tree-folder-icon { width: 16px; height: 16px; color: var(--folder); flex: 0 0 auto; }
        .sb-item .tree-folder-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sb-item .tree-toggle {
            width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center;
            flex: 0 0 auto; color: var(--text-secondary); border-radius: 3px;
        }
        .sb-item .tree-toggle svg { width: 12px; height: 12px; transition: transform var(--motion-fast) ease; }
        .sb-item .tree-toggle.expanded svg { transform: rotate(90deg); }
        .sb-item .tree-toggle.empty { visibility: hidden; }

        /* ===== Right-click context menu ===== */
        .context-menu {
            position: fixed; z-index: var(--z-menu); min-width: 190px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: 0 16px 48px var(--shadow-lg);
            padding: 6px; opacity: 0; transform: scale(.96); transform-origin: top left;
            pointer-events: none; transition: opacity var(--motion-fast) ease, transform var(--motion-fast) var(--ease);
        }
        .context-menu.show { opacity: 1; transform: scale(1); pointer-events: auto; }
        .context-menu-item {
            display: flex; align-items: center; gap: 10px; width: 100%;
            padding: 8px 10px; border: none; background: none; cursor: pointer;
            color: var(--text); font: inherit; font-size: 13px; text-align: left;
            border-radius: var(--radius-sm); transition: background var(--motion-fast) ease;
        }
        .context-menu-item:hover, .context-menu-item.cm-focus { background: var(--bg-tertiary); }
        .context-menu-item.danger { color: var(--danger); }
        .context-menu-item svg { width: 15px; height: 15px; flex: 0 0 auto; opacity: .85; }
        .context-menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }

        /* ===== Inline rename ===== */
        .inline-rename {
            width: 100%; font: inherit; font-size: 13px; text-align: center;
            background: var(--bg); color: var(--text);
            border: 1.5px solid var(--accent); border-radius: var(--radius-sm);
            padding: 2px 6px; outline: none;
        }
        .file-table .inline-rename { text-align: left; }

        /* ===== Toast variants ===== */
        .toast { display: flex; align-items: center; gap: 10px; border-left: 3px solid var(--accent); }
        .toast.success { border-left-color: var(--success); }
        .toast.error { border-left-color: var(--danger); }
        .toast-ico { width: 16px; height: 16px; flex: 0 0 auto; }
        .toast.success .toast-ico { color: var(--success); }
        .toast.error .toast-ico { color: var(--danger); }
        .toast.info .toast-ico { color: var(--accent); }

        /* ===== Skeleton loaders ===== */
        .skeleton {
            background: linear-gradient(100deg, var(--bg-secondary) 30%, var(--bg-tertiary) 50%, var(--bg-secondary) 70%);
            background-size: 200% 100%; animation: shimmer 1.2s ease-in-out infinite;
            border-radius: var(--radius-lg); border: 1px solid var(--border); height: 120px;
        }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }

        /* ===== Accessibility: visible focus + reduced motion ===== */
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important; animation-iteration-count: 1 !important;
                transition-duration: .001ms !important; scroll-behavior: auto !important;
            }
        }

        /* Column filter dropdown (1J) */
        .col-filter-btn {
            width: 14px; height: 14px; border: none; background: none; padding: 0;
            color: var(--text-secondary); cursor: pointer; opacity: 0;
            transition: opacity var(--motion-fast) ease;
            display: inline-flex; align-items: center; margin-left: 4px;
            vertical-align: middle; flex-shrink: 0;
        }
        .file-table-header .col:hover .col-filter-btn,
        .file-table-header .col.col-filtered .col-filter-btn { opacity: 1; }
        .file-table-header .col.col-filtered .col-filter-btn { color: var(--accent); }
        .col-filter-dropdown {
            position: fixed; z-index: 300; min-width: 200px; max-height: 300px; overflow-y: auto;
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-md); box-shadow: 0 8px 24px var(--shadow-lg);
            padding: 6px; display: none;
        }
        .col-filter-dropdown.show { display: block; }
        .col-filter-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 4px 6px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
            color: var(--text-secondary);
        }
        .col-filter-clear-btn {
            font-size: 11px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0;
        }
        .col-filter-item {
            display: flex; align-items: center; gap: 8px; padding: 5px 8px;
            border-radius: var(--radius-sm); font-size: 12px; cursor: pointer; color: var(--text);
        }
        .col-filter-item:hover { background: var(--bg-tertiary); }
        .col-filter-item input[type="checkbox"] { width: 13px; height: 13px; accent-color: var(--accent); cursor: pointer; }
        .col-filter-count {
            font-size: 10px; color: var(--text-secondary); background: var(--bg-tertiary);
            padding: 1px 5px; border-radius: 10px; margin-left: auto; flex-shrink: 0;
        }
        .col-filter-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .col-filter-search-wrap {
            display: flex; align-items: center; gap: 6px;
            padding: 4px 6px; margin-bottom: 2px;
        }
        .col-filter-search-wrap svg { flex-shrink: 0; color: var(--text-secondary); }
        .col-filter-search {
            flex: 1; border: 1px solid var(--border); background: var(--bg);
            color: var(--text); font-size: 12px; padding: 4px 8px;
            border-radius: var(--radius-sm); outline: none;
        }
        .col-filter-search:focus { border-color: var(--accent); }
        .col-filter-search::placeholder { color: var(--text-secondary); }
        .col-filter-divider { height: 1px; background: var(--border); margin: 4px 6px 6px; }

        /* Inline folder expand (1K) */
        .file-item--inline-child {
            background: var(--bg) !important;
            border-left: 2px solid var(--accent) !important;
            opacity: 0.92;
        }
        .file-item--inline-child .file-item-content { padding-left: calc(4px + var(--inline-depth, 0) * 20px); }
        .file-item.folder-expanded {
            border-bottom: none;
        }
        .folder-expand-indicator {
            display: inline-flex; align-items: center;
            width: 16px; height: 16px; flex-shrink: 0;
            color: var(--text-secondary); cursor: pointer;
            transition: transform var(--motion-fast) ease;
        }
        .folder-expand-indicator.open { transform: rotate(90deg); color: var(--accent); }
        .folder-expand-indicator svg { width: 10px; height: 10px; }

        /* Image lightbox (1M) */
        .lightbox {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 400;
            display: none; align-items: center; justify-content: center;
        }
        .lightbox.show { display: flex; }
        .lightbox-content {
            position: relative; max-width: 90vw; max-height: 90vh;
            display: flex; align-items: center; justify-content: center;
        }
        .lightbox img {
            max-width: 90vw; max-height: 88vh; object-fit: contain;
            border-radius: var(--radius-md); box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .lightbox-close {
            position: fixed; top: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.1); border: none; color: white; cursor: pointer;
            border-radius: 50%; font-size: 20px; display: flex; align-items: center; justify-content: center;
            transition: background var(--motion-fast) ease;
        }
        .lightbox-close:hover { background: rgba(255,255,255,0.2); }
        .lightbox-nav {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 44px; height: 44px; background: rgba(255,255,255,0.1);
            border: none; color: white; cursor: pointer; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: background var(--motion-fast) ease; font-size: 18px;
        }
        .lightbox-nav:hover { background: rgba(255,255,255,0.2); }
        .lightbox-nav.prev { left: 20px; }
        .lightbox-nav.next { right: 20px; }
        .lightbox-caption {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: rgba(255,255,255,0.7); font-size: 13px; white-space: nowrap;
            background: rgba(0,0,0,0.4); padding: 6px 14px; border-radius: 20px;
        }

        /* Markdown preview (1N) */
        .markdown-preview {
            display: none; padding: 16px; overflow: auto; max-height: 60vh;
            line-height: 1.7; font-size: 14px; color: var(--text);
        }
        .markdown-preview.active { display: block; }
        .markdown-preview h1, .markdown-preview h2, .markdown-preview h3 {
            margin: 1em 0 0.5em; font-family: 'Fraunces', serif;
            border-bottom: 1px solid var(--border); padding-bottom: 0.3em;
        }
        .markdown-preview h1 { font-size: 1.8em; }
        .markdown-preview h2 { font-size: 1.4em; }
        .markdown-preview h3 { font-size: 1.2em; }
        .markdown-preview p { margin: 0.8em 0; }
        .markdown-preview code { background: var(--bg-tertiary); padding: 2px 5px; border-radius: 3px; font-size: 0.9em; }
        .markdown-preview pre { background: var(--bg-tertiary); padding: 12px; border-radius: 6px; overflow: auto; }
        .markdown-preview pre code { background: none; padding: 0; }
        .markdown-preview a { color: var(--accent); }
        .markdown-preview ul, .markdown-preview ol { padding-left: 1.5em; margin: 0.5em 0; }
        .markdown-preview blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--text-secondary); margin: 0.8em 0; }
        .markdown-preview table { border-collapse: collapse; width: 100%; margin: 0.8em 0; }
        .markdown-preview th, .markdown-preview td { border: 1px solid var(--border); padding: 6px 10px; font-size: 13px; }
        .markdown-preview th { background: var(--bg-tertiary); font-weight: 600; }

        @media (max-width: 768px) {
            .files-layout { flex-direction: column; }
            .files-sidebar { display: none; }
            .main { padding: 16px; }
            .file-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 10px; }
            .file-item { padding: 12px 8px 40px; }
            .file-icon { width: 44px; height: 44px; }
            .file-icon svg { width: 40px; height: 40px; }
            .drop-zone { padding: 20px 16px; }
            .header { padding: 12px 16px; }
            .toolbar-search input { width: 120px; }
            .nav-bar { margin: 0 -16px 16px; top: 57px; padding: 10px 16px; }
            .btn { padding: 8px 12px; font-size: 12px; }
            .toolbar { gap: 10px; }
            .selection-bar { padding: 10px 16px; gap: 12px; }
            .toast { right: 16px; left: 16px; bottom: 16px; }
            .upload-progress { left: 16px; right: 16px; min-width: auto; }
        }
    </style>
</head>
<body>
    <header class="header">

    <main class="main">

        <div class="files-content">

            <button class="view-toggle" id="viewToggle" onclick="toggleView()" data-tip="Toggle grid / list view" title="Toggle grid / list view">

                </svg>

            <button class="view-toggle" onclick="openGlobalSearch()" data-tip="Search all files  (/)" title="Search all files (/)">

                        <polyline points="14 2 14 8 20 8"/>

        <div class="drop-zone" id="dropZone">

    <!-- Tile Modal -->
    <div class="modal" id="tileModal">

                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>

            </div>

    <script>
        // Safe localStorage wrapper — Edge Tracking Prevention can block storage access
        const ls = {
            get: (k, def='') => { try { return localStorage.getItem(k) ?? def; } catch { return def; } },
            set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
        };

        let currentPath = '';
        let ws = null;
        let pendingPasteFile = null;
        let draggedItem = null;
        let allFiles = [];
        let filterQuery = '';
        let sortMode = 'name';
        let filterType = ls.get('filterType', 'all');
        let viewMode = ls.get('viewMode', 'grid');
        let listSortCol = ls.get('listSortCol', 'name');
        let listSortDir = ls.get('listSortDir', 'asc');
        let selectedFiles = new Set();
        let lastSelectedIndex = -1;
        let focusedIndex = -1;
        let currentEditPath = '';
        let inlineRenamePath = null;
        let inlineRenameOriginal = '';
        let foundInlineRename = false;
        let multiSelectMode = false;
        let itemScale = parseInt(ls.get('itemScale', '140'));
        let expandedFolderPaths = new Set();
        let expandedFolderContents = {};
        let colFilters = {};
        let colTextFilters = {};
        let sidebarShowFiles = ls.get('sidebarShowFiles') === '1';
        let sidebarFileChildren = {};
        let lightboxImages = [];
        let lightboxIndex = 0;

        // Theme
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            html.setAttribute('data-theme', isDark ? 'light' : 'dark');
            ls.set('theme', isDark ? 'light' : 'dark');
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.getElementById('themeIcon').innerHTML = isDark
                ? '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>'
                : '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }

        // WebSocket
        let wsRetry = 0;
        const STRUCTURE_ACTIONS = ['folder', 'move', 'delete', 'upload', 'rename'];
        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${location.host}/ws`);

            ws.onopen = () => {
                wsRetry = 0;
                document.getElementById('statusDot').classList.add('connected');
                document.getElementById('statusText').textContent = 'Live';
            };

            ws.onclose = () => {
                console.log('WebSocket closed, reconnecting in 2s...');
                document.getElementById('statusDot').classList.remove('connected');
                document.getElementById('statusText').textContent = 'Reconnecting...';
                // Exponential backoff with jitter (1s → ~30s cap) avoids thundering-herd on restart.
                const delay = Math.min(30000, 1000 * Math.pow(2, wsRetry++)) + Math.random() * 1000;
                setTimeout(connectWS, delay);
            };

            ws.onmessage = (e) => {
                let data;
                try { data = JSON.parse(e.data); } catch { return; }
                loadFiles();
                // Folder structure may have changed — refresh the sidebar tree from the server.
                if (STRUCTURE_ACTIONS.includes(data.action)) loadSidebarTree();
                const actions = { delete: 'Deleted', upload: 'Added', folder: 'Created', rename: 'Renamed', move: 'Moved', edit: 'Edited' };
                showToast(`${actions[data.action] || 'Updated'}: ${escapeHtml(String(data.path).split('/').pop())}`,
                          data.action === 'delete' ? 'error' : 'success');
            };
        }

        async function loadFiles() {

                allFiles = await res.json();
            } catch (err) {
                showToast('Could not load files', 'error');
                return;

            focusedIndex = -1;
            renderFiles(allFiles);
            updateBreadcrumb();
            renderSidebar();
        }

        function buildInlineChildren(folderPath, depth) {
            const children = expandedFolderContents[folderPath] || [];
            if (!children.length) return '';
            return children.map(child => {
                const childPath = folderPath + '/' + child.name;
                const childEscaped = escapeAttr(childPath);
                const childIsExpanded = child.is_dir && expandedFolderPaths.has(childPath);
                const childDatePart = child.modified ? formatDatePart(child.modified) : '';
                const childTimePart = child.modified ? formatTimePart(child.modified) : '';
                const childFileType = getFileType(child.name, child.is_dir);
                const expandBtn = child.is_dir
                    ? `<div class="folder-expand-indicator ${childIsExpanded ? 'open' : ''}" onclick="event.stopPropagation(); toggleFolderInlineExpand('${childEscaped}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>`
                    : `<div class="folder-expand-indicator" style="visibility:hidden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></div>`;
                let html = `<div class="file-item file-item--inline-child${childIsExpanded ? ' folder-expanded' : ''}" style="--inline-depth:${depth}"
                                 data-path="${childEscaped}" data-name="${escapeAttr(child.name)}" data-is-dir="${child.is_dir}"
                                 ondblclick="handleItemDblClick(event,'${childEscaped}',${child.is_dir})"
                                 onclick="handleItemClick(event,'${childEscaped}',${child.is_dir})"
                                 oncontextmenu="showContextMenu(event,'${childEscaped}','${escapeAttr(child.name)}',${child.is_dir})">

                                    <div class="file-icon">${getFileIconHtml(child.name, child.is_dir, childPath)}</div>

                                    <div class="file-name">${escapeHtml(child.name)}</div>
                                    <div class="file-type">${childFileType}</div>
                                    <div class="file-meta">${child.is_dir ? '—' : formatSize(child.size)}</div>
                                    <div class="file-date-part">${childDatePart}</div>
                                    <div class="file-time-part">${childTimePart}</div>
                                </div>
                            </div>`;
                if (child.is_dir && childIsExpanded) {
                    html += buildInlineChildren(childPath, depth + 1);
                }
                return html;

        const IMAGE_EXTENSIONS = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'];
        const EDITABLE_EXTENSIONS = ['txt', 'csv', 'py', 'json', 'md', 'rs', 'js', 'ts', 'html', 'css', 'toml', 'yaml', 'yml', 'sql', 'm3u', 'sh', 'go', 'rb', 'php', 'xml'];

        function isImageFile(name) {
            const ext = name.split('.').pop().toLowerCase();
            return IMAGE_EXTENSIONS.includes(ext);
        }

        function isEditableFile(name) {
            const ext = name.split('.').pop().toLowerCase();
            return EDITABLE_EXTENSIONS.includes(ext);
        }

        function getFileIconHtml(name, isDir, fullPath) {
            if (!isDir && isImageFile(name)) {
                const thumbUrl = `/api/download?path=${encodeURIComponent(fullPath)}`;
                const fallbackIcon = getFileIcon(name, false).replace(/"/g, '&quot;');
                return `<img class="file-thumb" src="${thumbUrl}" loading="lazy" onload="this.classList.add('loaded')" onerror="handleThumbError(this, '${fallbackIcon}')">`;
            }
            return getFileIcon(name, isDir);
        }

        function handleThumbError(img, fallbackIcon) {
            const container = img.parentElement;
            container.classList.remove('has-thumb');
            container.innerHTML = decodeHtmlEntities(fallbackIcon);
        }

        function decodeHtmlEntities(str) {
            const txt = document.createElement('textarea');
            txt.innerHTML = str;
            return txt.value;
        }

        function getFileCategory(name) {
            const ext = name.split('.').pop().toLowerCase();
            const images = ['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp', 'ico', 'bmp'];
            const documents = ['pdf', 'doc', 'docx', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'csv', 'ppt', 'pptx'];
            const code = ['js', 'ts', 'jsx', 'tsx', 'html', 'css', 'json', 'py', 'rs', 'go', 'java', 'c', 'cpp', 'h', 'php', 'rb', 'sh', 'yml', 'yaml', 'xml', 'sql', 'md'];
            const media = ['mp4', 'mov', 'avi', 'mkv', 'webm', 'wmv', 'mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a'];

            if (images.includes(ext)) return 'images';
            if (documents.includes(ext)) return 'documents';
            if (code.includes(ext)) return 'code';
            if (media.includes(ext)) return 'media';
            return 'other';
        }

        function getFileType(name, isDir) {
            if (isDir) return 'Folder';
            const ext = name.split('.').pop().toLowerCase();
            if (ext === name.toLowerCase()) return 'File';
            return ext.toUpperCase();
        }

        function applyFilters(files) {
            let filtered = files;
            if (filterQuery) {
                const q = filterQuery.toLowerCase();
                filtered = filtered.filter(f => f.name.toLowerCase().includes(q));
            }

            if (filterType !== 'all') {
                filtered = filtered.filter(f => f.is_dir || getFileCategory(f.name) === filterType);
            }

            // Apply per-column checkbox filters
            Object.entries(colFilters).forEach(([col, vals]) => {
                if (!vals || vals.size === 0) return;
                filtered = filtered.filter(f => {
                    let v = '';
                    if (col === 'name') v = f.name;
                    else if (col === 'type') v = getFileType(f.name, f.is_dir);
                    else if (col === 'modified') v = f.modified ? formatDatePart(f.modified) : '';
                    return vals.has(v);
                });
            });
            // Apply per-column text (contains) filters
            Object.entries(colTextFilters).forEach(([col, text]) => {
                if (!text) return;
                const lc = text.toLowerCase();
                filtered = filtered.filter(f => {
                    let v = '';
                    if (col === 'name') v = f.name;
                    else if (col === 'type') v = getFileType(f.name, f.is_dir);
                    else if (col === 'modified') v = f.modified ? formatDatePart(f.modified) : '';
                    return v.toLowerCase().includes(lc);
                });
            });

            const compare = (a, b) => {
                // Folders always first
                if (a.is_dir !== b.is_dir) return a.is_dir ? -1 : 1;

                // Use list sort settings when in list view
                if (viewMode === 'list') {
                    const dir = listSortDir === 'asc' ? 1 : -1;
                    let result = 0;

                    switch (listSortCol) {
                        case 'name':
                            result = a.name.toLowerCase().localeCompare(b.name.toLowerCase());
                            break;
                        case 'type':
                            result = getFileType(a.name, a.is_dir).localeCompare(getFileType(b.name, b.is_dir));
                            break;
                        case 'size':
                            result = (a.size || 0) - (b.size || 0);
                            break;
                        case 'modified':
                            result = (a.modified || 0) - (b.modified || 0);
                            break;
                    }
                    return result * dir;
                }

                // Grid view uses toolbar sort
                if (sortMode === 'size') return (b.size || 0) - (a.size || 0);
                if (sortMode === 'modified') return (b.modified || 0) - (a.modified || 0);
                return a.name.toLowerCase().localeCompare(b.name.toLowerCase());
            };

            return filtered.slice().sort(compare);
        }

        function sortByColumn(col) {

                listSortDir = listSortDir === 'asc' ? 'desc' : 'asc';
            } else {

        // Folder upload utilities using webkitGetAsEntry API
        async function readEntryAsFile(entry) {
            return new Promise((resolve, reject) => {
                entry.file(resolve, reject);
            });
        }

        async function readDirectoryEntries(dirEntry) {
            return new Promise((resolve, reject) => {
                const reader = dirEntry.createReader();
                const entries = [];

                function readBatch() {
                    reader.readEntries((batch) => {
                        if (batch.length === 0) {
                            resolve(entries);
                        } else {
                            entries.push(...batch);
                            readBatch(); // Continue reading (directories may have >100 entries)
                        }
                    }, reject);
                }
                readBatch();
            });
        }

        async function collectFilesFromEntry(entry, basePath = '') {
            const files = [];
            const relativePath = basePath ? `${basePath}/${entry.name}` : entry.name;

            if (entry.isFile) {
                try {
                    const file = await readEntryAsFile(entry);
                    // Create new File with relative path as name
                    const fileWithPath = new File([file], relativePath, {
                        type: file.type,
                        lastModified: file.lastModified
                    });
                    files.push(fileWithPath);
                } catch (e) {
                    console.warn('Could not read file:', relativePath, e);
                }
            } else if (entry.isDirectory) {
                const entries = await readDirectoryEntries(entry);
                for (const childEntry of entries) {
                    const childFiles = await collectFilesFromEntry(childEntry, relativePath);
                    files.push(...childFiles);
                }
            }
            return files;
        }

        async function processDataTransferItems(items) {
            const files = [];
            const entries = [];

            // First, get all entries (must be done synchronously before items expire)
            for (const item of items) {
                if (item.kind === 'file') {
                    const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                    if (entry) {
                        entries.push(entry);
                    } else {
                        // Fallback for browsers without webkitGetAsEntry
                        const file = item.getAsFile();
                        if (file) files.push(file);
                    }
                }
            }

            // Process entries (can be async)
            for (const entry of entries) {
                const entryFiles = await collectFilesFromEntry(entry);
                files.push(...entryFiles);
            }

            return files;
        }

        function initUploadUI(files) {

                    </div>
                    <div class="upload-progress-error"></div>
                </div>
            `).join('');
        }

        function updateUploadItem(item) {
            const row = document.querySelector(`.upload-progress-item[data-upload-id="${item.id}"]`);
            if (!row) return;
            const statusEl = row.querySelector('.upload-progress-status');
            const fill = row.querySelector('.upload-progress-bar-fill');
            const errorEl = row.querySelector('.upload-progress-error');
            const pct = item.total > 0 ? Math.min(100, Math.round((item.loaded / item.total) * 100)) : 0;

            row.classList.toggle('error', item.status === 'error');

            if (item.status === 'done') {
                statusEl.textContent = 'Done';
                fill.style.width = '100%';
            } else if (item.status === 'error') {
                statusEl.textContent = 'Failed';
                fill.style.width = '100%';
                errorEl.textContent = item.error || 'Upload failed';
            } else if (item.status === 'uploading') {
                statusEl.textContent = `Uploading ${pct}%`;
                fill.style.width = `${pct}%`;
            } else {
                statusEl.textContent = 'Queued';
            }
        }

        function updateOverallUploadProgress(state) {
            const fill = document.getElementById('progressFill');
            const meta = document.getElementById('uploadProgressMeta');

            const totalBytes = state.totalBytes || 1;
            const loadedBytes = state.files.reduce((sum, item) => {
                if (item.status === 'done' || item.status === 'error') {
                    return sum + item.size;
                }
                return sum + Math.min(item.loaded || 0, item.size);
            }, 0);

            const percent = Math.min(100, Math.round((loadedBytes / totalBytes) * 100));
            const completed = state.files.filter(item => item.status === 'done').length;

            fill.style.width = `${percent}%`;
            meta.textContent = `${percent}% · ${completed}/${state.files.length} uploaded`;
        }

        function getUploadErrorText(xhr) {
            const raw = xhr.responseText || '';
            try {
                const parsed = JSON.parse(raw);
                if (parsed && parsed.error) {
                    return parsed.error;
                }
            } catch (err) {}
            if (raw) {
                return raw;
            }
            return `Upload failed (${xhr.status})`;
        }

        function uploadSingleFile(fileItem, state, url) {
            return new Promise((resolve) => {
                const xhr = new XMLHttpRequest();

                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        fileItem.total = e.total || fileItem.size;
                        fileItem.loaded = e.loaded;
                        updateUploadItem(fileItem);
                        updateOverallUploadProgress(state);
                    }
                };

                xhr.onload = () => {
                    if (xhr.status === 200) {
                        fileItem.status = 'done';
                    } else {
                        fileItem.status = 'error';
                        fileItem.error = getUploadErrorText(xhr);
                    }
                    fileItem.loaded = fileItem.total || fileItem.size;
                    updateUploadItem(fileItem);
                    updateOverallUploadProgress(state);
                    resolve();
                };

                xhr.onerror = () => {
                    fileItem.status = 'error';
                    fileItem.error = 'Upload failed';
                    fileItem.loaded = fileItem.total || fileItem.size;
                    updateUploadItem(fileItem);
                    updateOverallUploadProgress(state);
                    resolve();
                };

                const mtimes = {};
                if (fileItem.file.lastModified) {
                    mtimes[fileItem.file.name] = fileItem.file.lastModified;
                }
                const formData = new FormData();
                formData.append('mtimes', new Blob([JSON.stringify(mtimes)], { type: 'application/json' }));
                formData.append('files', fileItem.file, fileItem.file.name);

                xhr.open('POST', url);
                xhr.send(formData);
            });
        }

        async function runUpload(files) {
            const url = currentPath ? `/api/upload?path=${encodeURIComponent(currentPath)}` : '/api/upload';
            const items = files.map((file, index) => ({
                id: `${Date.now()}-${index}-${Math.random().toString(36).slice(2, 8)}`,
                file,
                name: file.name,
                size: file.size || 0,
                loaded: 0,
                total: file.size || 0,
                status: 'queued',
                error: ''
            }));

            const state = {
                files: items,
                totalBytes: items.reduce((sum, item) => sum + (item.size || 0), 0)
            };

            initUploadUI(items);
            updateOverallUploadProgress(state);

            for (const item of items) {
                item.status = 'uploading';
                updateUploadItem(item);
                updateOverallUploadProgress(state);
                await uploadSingleFile(item, state, url);
            }

            const successCount = items.filter(item => item.status === 'done').length;
            const errorCount = items.filter(item => item.status === 'error').length;
            const title = document.getElementById('uploadProgressTitle');
            const progress = document.getElementById('uploadProgress');
            const closeBtn = document.getElementById('uploadProgressClose');

            if (successCount > 0) {
                loadFiles();
            }

            if (errorCount > 0) {
                title.textContent = `Upload finished with ${errorCount} error${errorCount === 1 ? '' : 's'}`;
                progress.classList.add('show-close');
                closeBtn.setAttribute('aria-hidden', 'false');
            } else {
                title.textContent = 'Upload complete';
                progress.classList.add('show-close');
                closeBtn.setAttribute('aria-hidden', 'false');
                setTimeout(() => dismissUploadProgress(), 2000);
            }

            if (successCount > 0 && errorCount > 0) {
                showToast(`Uploaded ${successCount} file${successCount === 1 ? '' : 's'}, ${errorCount} failed`);
            } else if (successCount > 0) {
                showToast(`Uploaded ${successCount} file${successCount === 1 ? '' : 's'}`);
            } else {
                showToast(`Upload failed (${errorCount} file${errorCount === 1 ? '' : 's'})`);
            }
        }
