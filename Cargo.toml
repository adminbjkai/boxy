[package]
name = "boxy"
version = "1.5.1"
edition = "2021"

[dependencies]
actix-web = "4"
actix-ws = "0.3"
actix-multipart = "0.7"
tokio = { version = "1", features = ["full", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
mime_guess = "2"
async-recursion = "1"
env_logger = "0.11"
filetime = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
